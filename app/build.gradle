plugins {
    id 'com.android.application'
}

android {
    namespace 'com.bai.bookshelf'
    compileSdk 36

    defaultConfig {
        applicationId "com.bai.bookshelf"
        minSdk 24
        targetSdk 36
        versionCode 39
        versionName "4.0"

        // v4.0（评审 #11）：Room 导出 schema JSON 到 app/schemas/，
        // 供版本间迁移比对与将来的 Room Migration 测试使用
        javaCompileOptions {
            annotationProcessorOptions {
                arguments += ["room.schemaLocation": "$projectDir/schemas"]
            }
        }
    }

    buildTypes {
        debug {
            // 测试版：启用豆瓣评分自动获取（实验性功能）
            buildConfigField "boolean", "FEATURE_DOUBAN", "true"
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // 正式版与测试版使用同一个 debug 签名：
            // ① 未配置发布证书时也能打包出可安装的正式版；
            // ② 签名一致 → 用户从测试版覆盖安装正式版时系统视为同应用升级，
            //    Room 数据库与 filesDir 文件（封面/备注图片）全部保留，无感切换。
            signingConfig signingConfigs.debug
            // 正式版不启用豆瓣评分（默认关闭）
            buildConfigField "boolean", "FEATURE_DOUBAN", "false"
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    // 基础 UI
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'

    // Room 本地数据库（SQLite）
    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'

    // CameraX 相机 + ML Kit 条形码识别（本地识别，免费）
    def camerax_version = "1.3.4"
    implementation "androidx.camera:camera-core:$camerax_version"
    implementation "androidx.camera:camera-camera2:$camerax_version"
    implementation "androidx.camera:camera-lifecycle:$camerax_version"
    implementation "androidx.camera:camera-view:$camerax_version"
    implementation 'com.google.mlkit:barcode-scanning:17.2.0'

    // 网络：ISBN 图书信息查询
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    // 云市场密钥加密存储（v4.0，评审 #4：EncryptedSharedPreferences）
    implementation 'androidx.security:security-crypto:1.1.0'

    // 封面图片加载与缓存
    implementation 'com.github.bumptech.glide:glide:4.16.0'
}
